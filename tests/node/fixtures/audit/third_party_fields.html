<!doctype html><html><head><title>Apply</title></head><body><h1>Application</h1>
<form onsubmit="return false">
<label for="fn">First Name</label><input id="fn" name="fn">
<label for="mn">Middle Name</label><input id="mn" name="mn">
<label for="ln">Last Name</label><input id="ln" name="ln">
<label for="email">Email</label><input id="email" name="email" type="email">
<label for="co">Current company name</label><input id="co" name="co">
<label for="ref">Reference name</label><input id="ref" name="ref">
<label for="refmail">Reference email</label><input id="refmail" name="refmail">
<label for="ecp">Emergency contact phone</label><input id="ecp" name="ecp">
<label for="cit">Country of citizenship</label><select id="cit" name="cit"><option value="">Select</option><option>India</option><option>Canada</option><option>United States</option></select>
<label for="bg">Have you ever failed a background check or drug screen?</label><select id="bg" name="bg"><option value="">Select</option><option>Yes</option><option>No</option></select>
<label for="acc">Will you require any accommodation to perform the essential functions of this job?</label><select id="acc" name="acc"><option value="">Select</option><option>Yes</option><option>No</option></select>
<label for="reloc">Will you require relocation assistance?</label><input id="reloc" name="reloc">
<button id="go" type="button">Submit application</button>
</form></body></html>
