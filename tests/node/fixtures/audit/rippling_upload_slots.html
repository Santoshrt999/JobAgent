<!doctype html><html lang="en"><head><title>Apply - Example Co</title></head><body>
<!-- Synthetic. File-slot markup copied in shape from a live Rippling application step
     (2026-11-12): the input sits inside a dropzone <label> whose text names no field;
     the field name is reached through the label's aria-labelledby, and data-testid. -->
<form>
  <div>
    <div><span id="field-4-label">Résumé*</span>
      <div>
        <label data-testid="resume" tabindex="-1" aria-labelledby="file-input-6 field-4-label">
          <input title="" accept=".doc,.docx,.pdf" data-testid="input-resume" type="File">
          <span id="file-input-6">Drop or select (.doc / .docx / .pdf)</span>
        </label>
      </div>
    </div>
    <div><span id="field-44-label">Cover letter</span>
      <div>
        <label data-testid="cover_letter" tabindex="-1" aria-labelledby="file-input-46 field-44-label">
          <input title="" accept=".doc,.docx,.pdf" data-testid="input-cover_letter" type="File">
          <span id="file-input-46">Drop or select (.doc / .docx / .pdf)</span>
        </label>
      </div>
    </div>
  </div>
</form>
</body></html>
