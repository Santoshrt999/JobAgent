<!doctype html><html><head><title>Apply</title></head><body><h1>Application</h1>
<form onsubmit="return false">
<label for="email">Email</label><input id="email" name="email" type="email">
<fieldset><legend>Are you willing to relocate?</legend>
<label><input type="radio" name="q_relocate" value="1"> Yes</label>
<label><input type="radio" name="q_relocate" value="0"> No</label></fieldset>
<fieldset><legend>Do you consent to a background check?</legend>
<label><input type="radio" name="q_bg" value="1"> Yes</label>
<label><input type="radio" name="q_bg" value="0"> No</label></fieldset>
<fieldset><legend>Which shifts can you work?</legend>
<label><input type="checkbox" name="shift_day" id="shift_day"> Day</label>
<label><input type="checkbox" name="shift_night" id="shift_night"> Night</label></fieldset>
<button id="go" type="button">Submit application</button>
</form></body></html>
