name: Release

# Pushing a tag vMAJOR.MINOR.PATCH runs the full CI, then creates a DRAFT
# GitHub release whose notes come from the in-app changelog
# (src/dashboard/public/assets/js/changelog-data.js). A human publishes it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  draft-release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      # Fails unless the tag, package.json "version" and a changelog entry agree.
      - name: Release notes from the changelog
        run: node scripts/releaseNotes.mjs --notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "JobAgent $GITHUB_REF_NAME" --notes-file release-notes.md
